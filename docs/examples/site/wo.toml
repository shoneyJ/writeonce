name        = "site"
version     = "0.1.0"
description = "writeonce.de — the language tutorial served by the language: framework + writeonce-view [deps], @table chapters, server-rendered pages"

[runtime]
wo = ">= 0.1"

# Two real dependencies (the gate substitutes file:// remotes built from
# docs/examples/writeonce-serve and docs/examples/writeonce-view, so CI never
# touches the network). The [deps] KEY is the module name `use` imports.
[deps]
serve     = { git = "https://github.com/shoneyj/writeonce-serve", rev = "v0.1.0" }
view      = { git = "https://github.com/shoneyj/writeonce-view", rev = "v0.1.0" }
