<template w:component="ProductCard">
  <div class="card">
    <h3><a href="/p/{{ self.sku }}">{{ self.name }}</a></h3>
    <p class="price">€ {{ self.price }}</p>
    <p w:if="self.stock > 0" class="stock">{{ self.stock }} in stock</p>
    <p w:if="self.stock == 0" class="stock out">sold out</p>
  </div>
</template>

<template w:component="ProductListPage">
  <h1>Products</h1>
  <div class="grid">{!! self.cards !!}</div>
</template>
